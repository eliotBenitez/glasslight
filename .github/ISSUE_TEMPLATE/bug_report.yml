name: Bug report
description: Report a reproducible problem with Glasslight
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this issue. Do not post clipboard contents or private local paths.
  - type: input
    id: shell-version
    attributes:
      label: GNOME Shell version
      placeholder: "50.4"
    validations:
      required: true
  - type: input
    id: extension-version
    attributes:
      label: Glasslight version
      description: The `version` value from metadata.json or the release number.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Glasslight with Alt+Space
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant lines with the `[Glasslight]` prefix after removing private data.
      render: shell
